name: Mutation (nightly, cold)

# agbossjs/agboss#1213, as the core's mutation-nightly.yml: every shard of
# scripts/mutation-shards.mjs with no cached results (`--force`), so a mutant an incremental run
# kept as killed is tested again against today's tests.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            fencing,
            effects-and-calls,
            pauses,
            money,
            migrations,
            store-bound,
            queue-watch,
            a2a-direct,
            a2a-tasks,
            mesh-requests,
            execution-records,
            checkpoints,
          ]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
      AGBOSS_POSTGRES_TEST_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      # the CLI's tests run bin/, which imports the built package; the flow types for the fixtures
      - name: Build
        run: npm run build && npm run check:types

      - name: Mutation testing of the shard, every mutant (break below 100 % killed or justified)
        run: npm run test:mutation -- --force
      # agbossjs/agboss#1367: a Timeout counts as killed, and a survivor whose run outlasts Stryker's limit reads
      # as one: each shard's timeoutMS is above its whole run (scripts/mutation-shards.mjs), so a Timeout left
      # must be a proven hang (scripts/stryker-proven-hangs.json); one that is not listed is run again alone
      # (agbossjs/mongodb#103: a loaded runner moves it between mutants), in a fresh Stryker process
      - name: No Timeout that is not a proven hang (agbossjs/agboss#1367)
        run: node scripts/stryker-timeouts.mjs --rerun reports/mutation/${{ matrix.shard }}.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
