name: CI

on:
  push:
    branches: [main]
  pull_request:
  # agbossjs/agboss#484: the fault suite on the real clock, every night
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  # Changelog fragments (agbossjs/agboss#981): a PR adds changes/<issue>-<slug>.md; only a release PR (branch
  # release/<version>) edits CHANGELOG.md, where scripts/changelog-assemble.mjs folds the fragments in.
  changelog-fragments:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/changelog-assemble.mjs --check
      - name: CHANGELOG.md is edited only by a release PR
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in release/*) echo "release PR: CHANGELOG.md may change"; exit 0 ;; esac
          if git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Do not edit CHANGELOG.md in a PR: add a fragment changes/<issue>-<slug>.md instead (see changes/README.md). Only a release PR (branch release/<version>) edits it."
            exit 1
          fi

  check:
    name: check (PostgreSQL 16, @agboss/core at the pinned SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      AGBOSS_POSTGRES_TEST_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # agbossjs/agboss#691: a commit pin packs the core from agbossjs/agboss; a release pin
      # (`source: "registry"`) downloads the published core, so no checkout is needed
      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Check (format, suppressions, lint, types, tests with coverage, API report)
        run: npm run check

      # agbossjs/agboss#624 AC2: the key-text properties at main's failing seed and 20 more, drawn
      # here and printed — a failure names its seed, `FC_SEED=<seed> npm run test:key-text-seeds`
      - name: The key-text properties at the #624 seed and 20 drawn seeds
        run: |
          seeds="-1186302779$(for _ in $(seq 20); do printf ',%d' $(( (RANDOM << 16 | RANDOM) - 1073741824 )); done)"
          echo "FC_SEED=$seeds"
          FC_SEED="$seeds" npm run test:key-text-seeds

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| | % |\n|---|---|\n'+['lines','branches','functions','statements'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

  # agbossjs/agboss#484 AC2: the core's fault suite on PostgreSQL — real pods on one database, killed,
  # stopped, frozen and cut off it. Always on the real clock (agbossjs/agboss#607: PostgreSQL decides
  # a lease's expiry by its own clock_timestamp(), so the pods run at its rate, the core's 30 s
  # lease), its scenarios split over three jobs to fit.
  faults:
    name: faults ${{ matrix.shard }}/3 (the fault suite on PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      AGBOSS_POSTGRES_TEST_URL: postgres://postgres:pw@localhost:5432/postgres
      AGBOSS_FAULT_SHARD: ${{ matrix.shard }}/3
      AGBOSS_FAULT_DUMP_DIR: ${{ github.workspace }}/fault-dumps
    steps:
      - uses: actions/checkout@v4

      # agbossjs/agboss#691: a commit pin packs the core from agbossjs/agboss; a release pin
      # (`source: "registry"`) downloads the published core, so no checkout is needed
      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: The fault suite
        run: npm run test:faults

      - name: The failed scenarios' events and store history
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fault-dumps-${{ matrix.shard }}
          path: fault-dumps
          if-no-files-found: ignore

  # agbossjs/agboss#1213 (the core's #533 item 3, #626): mutation testing of the money-path modules,
  # one job per shard of scripts/mutation-shards.mjs (MUTATION_SHARD), each incremental — its last
  # run's results cached, keyed by the mutation setup, so a change of the Stryker config or of a
  # shard's modules or tests runs it cold: every mutant killed or justified where it stands, else
  # red. mutation-nightly.yml runs every shard cold.
  mutation:
    name: mutation ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            fencing,
            effects-and-calls,
            pauses,
            money,
            migrations,
            store-bound,
            queue-watch,
            a2a-direct,
            a2a-tasks,
            mesh-requests,
            execution-records,
            execution-tree,
            checkpoints,
          ]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
      AGBOSS_POSTGRES_TEST_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      # the CLI's tests run bin/, which imports the built package; the flow types for the fixtures
      - name: Build
        run: npm run build && npm run check:types

      - name: Restore the shard's last mutation run
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental-${{ matrix.shard }}.json
          key: stryker-${{ matrix.shard }}-${{ hashFiles('stryker.config.mjs', 'scripts/mutation-shards.mjs', 'vitest.mutation.config.ts') }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.shard }}-${{ hashFiles('stryker.config.mjs', 'scripts/mutation-shards.mjs', 'vitest.mutation.config.ts') }}-

      - name: Mutation testing of the shard (break below 100 % killed or justified)
        run: npm run test:mutation
      # agbossjs/agboss#1367: a Timeout counts as killed, and a survivor whose run outlasts Stryker's limit reads
      # as one: each shard's timeoutMS is above its whole run (scripts/mutation-shards.mjs), so a Timeout left
      # must be a proven hang (scripts/stryker-proven-hangs.json); one that is not listed is run again alone
      # (agbossjs/mongodb#103: a loaded runner moves it between mutants), in a fresh Stryker process
      - name: No Timeout that is not a proven hang (agbossjs/agboss#1367)
        run: node scripts/stryker-timeouts.mjs --rerun reports/mutation/${{ matrix.shard }}.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
