name: CI

on:
  push:
    branches: [main]
  pull_request:
  # agbossjs/agboss#484: the fault suite on the real clock, every night
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  check:
    name: check (PostgreSQL 16, @agboss/core at the pinned SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      AGBOSS_POSTGRES_TEST_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # agbossjs/agboss#691: a commit pin packs the core from agbossjs/agboss; a release pin
      # (`source: "registry"`) downloads the published core, so no checkout is needed
      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: Check (format, suppressions, lint, types, tests with coverage, API report)
        run: npm run check

      # agbossjs/agboss#624 AC2: the key-text properties at main's failing seed and 20 more, drawn
      # here and printed — a failure names its seed, `FC_SEED=<seed> npm run test:key-text-seeds`
      - name: The key-text properties at the #624 seed and 20 drawn seeds
        run: |
          seeds="-1186302779$(for _ in $(seq 20); do printf ',%d' $(( (RANDOM << 16 | RANDOM) - 1073741824 )); done)"
          echo "FC_SEED=$seeds"
          FC_SEED="$seeds" npm run test:key-text-seeds

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| | % |\n|---|---|\n'+['lines','branches','functions','statements'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi

  # agbossjs/agboss#484 AC2: the core's fault suite on PostgreSQL — real pods on one database, killed,
  # stopped, frozen and cut off it. Always on the real clock (agbossjs/agboss#607: PostgreSQL decides
  # a lease's expiry by its own clock_timestamp(), so the pods run at its rate, the core's 30 s
  # lease), its scenarios split over three jobs to fit.
  faults:
    name: faults ${{ matrix.shard }}/3 (the fault suite on PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      AGBOSS_POSTGRES_TEST_URL: postgres://postgres:pw@localhost:5432/postgres
      AGBOSS_FAULT_SHARD: ${{ matrix.shard }}/3
      AGBOSS_FAULT_DUMP_DIR: ${{ github.workspace }}/fault-dumps
    steps:
      - uses: actions/checkout@v4

      # agbossjs/agboss#691: a commit pin packs the core from agbossjs/agboss; a release pin
      # (`source: "registry"`) downloads the published core, so no checkout is needed
      - name: Resolve the pinned framework
        id: pin
        run: |
          echo "sha=$(node -p "require('./.agboss-version.json').frameworkSha")" >> "$GITHUB_OUTPUT"
          echo "source=$(node -p "require('./.agboss-version.json').source ?? 'commit'")" >> "$GITHUB_OUTPUT"

      - name: Check out agbossjs/agboss at the pinned SHA
        if: steps.pin.outputs.source != 'registry'
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.sha }}
          path: .agboss-source

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Pack @agboss/core as pinned (a commit, or the registry's) and install the tarball
        env:
          AGBOSS_REPO_DIR: .agboss-source
        run: |
          npm run pack:framework
          npm run install:packed

      - name: The fault suite
        run: npm run test:faults

      - name: The failed scenarios' events and store history
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fault-dumps-${{ matrix.shard }}
          path: fault-dumps
          if-no-files-found: ignore
